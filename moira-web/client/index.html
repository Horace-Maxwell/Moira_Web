<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>七政四餘星盤 - Moira</title>
  <link rel="stylesheet" href="/styles.css?v=app-ui-native-63">
</head>
<body>
  <div class="app-window">
    <nav class="menubar" aria-label="Moira menu bar">
      <details class="menu">
        <summary>Moira</summary>
        <div class="menu-panel">
          <button class="menu-command" type="button" data-view-target="chart">關於 Moira Web</button>
          <button class="menu-command" type="button" data-view-target="calculation">服務狀態</button>
        </div>
      </details>
      <details class="menu">
        <summary>檔案(&F)</summary>
        <div class="menu-panel">
          <button class="menu-command" type="button" data-action="new">新增(&N)</button>
          <button class="menu-command" type="button" data-action="open">開啟(&O)... <span>Ctrl+O</span></button>
          <button class="menu-command" type="button" data-action="save">存檔(&S) <span>Ctrl+S</span></button>
          <button class="menu-command" type="button" data-action="save-as">另存新檔(&A)...</button>
          <hr>
          <button class="menu-command" type="button" data-action="print">列印(&P)... <span>Ctrl+P</span></button>
          <hr>
          <button class="menu-command" type="button" data-action="image-size">圖形面積設定(&J)...</button>
          <button class="menu-command" type="button" data-action="save-image">圖形存檔(&I)... <span>Ctrl+I</span></button>
          <hr>
          <button class="menu-command" type="button" data-action="open-modification">開啟修改檔案(&M)...</button>
          <button class="menu-command" type="button" data-action="restore-modification">修改還原(&R)</button>
          <hr>
          <button class="menu-command" type="button" data-action="open-evaluation">開啟解盤檔案(&E)...</button>
          <button class="menu-command" type="button" data-action="restore-evaluation">解盤還原(&Q)</button>
          <button class="menu-command" type="button" data-action="refresh-evaluation">更新解盤檔案(&L) <span>F3</span></button>
          <hr>
          <button class="menu-command" type="button" data-action="print-notes">列印及圖形註釋(&F)...</button>
          <button class="menu-command" type="button" data-action="save-settings">儲存設定(&B)...</button>
          <hr>
          <button class="menu-command" type="button" data-action="append">加入資料</button>
          <button class="menu-command" type="button" data-action="delete">刪除資料</button>
          <button class="menu-command" type="button" data-action="update">更新資料</button>
          <hr>
          <button class="menu-command" type="button" data-action="close-window">結束(&X)</button>
        </div>
      </details>
      <details class="menu">
        <summary>編輯(&E)</summary>
        <div class="menu-panel">
          <button class="menu-command" type="button" data-action="focus-name">輸入名稱及性別(&N)... <span>Cmd+N</span></button>
          <button class="menu-command" type="button" data-action="lunar-converter">陰曆轉換(&L)...</button>
          <hr>
          <button class="menu-command" type="button" data-action="edit-life-palace">修改命宮(&H)...</button>
          <button class="menu-command" type="button" data-action="edit-star-position">修改星曜位置(&P)...</button>
          <hr>
          <button class="menu-command" type="button" data-action="undo">復原(&Z) <span>Cmd+Z</span></button>
          <button class="menu-command" type="button" data-action="redo">取消復原(&Y) <span>Cmd+Shift+Z</span></button>
          <hr>
          <button class="menu-command" type="button" data-action="cut">剪下(&X) <span>Cmd+X</span></button>
          <button class="menu-command" type="button" data-action="copy">复制(&C) <span>Cmd+C</span></button>
          <button class="menu-command" type="button" data-action="paste">貼上(&V) <span>Cmd+V</span></button>
          <button class="menu-command" type="button" data-action="delete-selection">刪除(&D) <span>DEL</span></button>
          <hr>
          <button class="menu-command" type="button" data-action="select-all">全部(&A) <span>Cmd+A</span></button>
          <hr>
          <button class="menu-command" type="button" data-action="bold">粗体</button>
          <button class="menu-command" type="button" data-action="highlight">突显</button>
        </div>
      </details>
      <details class="menu">
        <summary>選項(&P)</summary>
        <div class="menu-panel menu-options menu-options-wide">
          <details class="menu-cascade">
            <summary>選擇星盤(&M)...</summary>
            <div class="menu-panel menu-subpanel">
              <button class="menu-command" type="button" data-set-control="mode" data-set-value="traditional" data-check-group="mode">七政四餘星盤</button>
              <button class="menu-command" type="button" data-set-control="mode" data-set-value="pick" data-check-group="mode">天星擇日</button>
              <button class="menu-command" type="button" data-set-control="mode" data-set-value="western" data-check-group="mode">占星盤</button>
              <button class="menu-command" type="button" data-set-control="mode" data-set-value="sidereal" data-check-group="mode">鄭氏星案</button>
            </div>
          </details>
          <hr>
          <label class="menu-check-row"><input name="showNow" form="chartForm" type="checkbox" checked> 顯示流年(&N) <span>⌃R</span></label>
          <label class="menu-check-row"><input name="showHoriz" form="chartForm" type="checkbox"> 顯示地平方位 <span>⌃P</span></label>
          <label class="menu-check-row"><input name="showAspects" form="chartForm" type="checkbox"> 顯示相位(&A) <span>⌃L</span></label>
          <label class="menu-check-row"><input name="showAnnotations" form="chartForm" type="checkbox"> 顯示神煞註釋(&E) <span>⌃E</span></label>
          <hr>
          <details class="menu-cascade">
            <summary>修正時間(&T)...</summary>
            <div class="menu-panel menu-subpanel">
              <button class="menu-command" type="button" data-set-control="timeAdjust" data-set-value="0" data-check-group="timeAdjust">標準時間</button>
              <button class="menu-command" type="button" data-set-control="timeAdjust" data-set-value="2" data-check-group="timeAdjust">真太陽時</button>
            </div>
          </details>
          <button class="menu-command" type="button" data-action="life-body-settings">立命安身(&X)...</button>
          <hr>
          <details class="menu-cascade">
            <summary>項目顯示</summary>
            <div class="menu-panel menu-subpanel">
              <button class="menu-command" type="button" data-view-target="calculation">✓ 星圖計算</button>
              <button class="menu-command" type="button" data-view-target="eight">✓ 四柱八字</button>
              <button class="menu-command" type="button" data-view-target="notes">✓ 星圖批註</button>
              <button class="menu-command" type="button" data-view-target="manage">✓ 資料管理系統</button>
            </div>
          </details>
          <details class="menu-cascade">
            <summary>工具列顯示</summary>
            <div class="menu-panel menu-subpanel">
              <label class="menu-check-row"><input type="checkbox" data-pref="toolbarFile" checked> 檔案圖示</label>
              <label class="menu-check-row"><input type="checkbox" data-pref="toolbarEdit" checked> 編輯圖示</label>
              <label class="menu-check-row"><input type="checkbox" data-pref="toolbarOptions" checked> 選項圖示</label>
              <label class="menu-check-row"><input type="checkbox" data-pref="toolbarSearch" checked> 尋找 <span>Ctrl+F</span></label>
            </div>
          </details>
          <hr>
          <button class="menu-command" type="button" data-action="planet-settings">選擇星曜(&I)...</button>
          <button class="menu-command" type="button" data-action="angle-settings">選擇角距顯示(&O)...</button>
          <button class="menu-command" type="button" data-action="spirit-settings">選擇神煞(&S)...</button>
          <button class="menu-command" type="button" data-action="pattern-settings">選擇政餘格局(&Z)...</button>
          <hr>
          <button class="menu-command" type="button" data-action="font-direction">字形方向設定(&V)...</button>
          <button class="menu-command" type="button" data-action="font-settings">字形設定(&F)...</button>
          <hr>
          <button class="menu-command" type="button" data-action="color-settings">色彩設定(&C)...</button>
          <label class="menu-check-row"><input type="checkbox" data-pref="monochrome"> 黑白色(&B)</label>
          <hr>
          <label class="menu-check-row"><input type="checkbox" data-pref="minimizeToTray"> 縮小在系統匣(&Q)</label>
          <hr>
          <button class="menu-command" type="button" data-action="toggle-language">繁体中文 (須重新啟動)(&L)</button>
          <hr>
          <button class="menu-command" type="button" data-action="reset-options">選項還原 (須重新啟動)(&R)</button>
        </div>
      </details>
      <details class="menu">
        <summary>搜索(&S)</summary>
        <div class="menu-panel">
          <button class="menu-command" type="button" data-action="search-transit">流年星法(&T)... <span>Ctrl+K</span></button>
          <button class="menu-command" type="button" data-action="search-primary">主限法(&P)... <span>Ctrl+R</span></button>
          <button class="menu-command" type="button" data-action="search-secondary">次限法(&S)... <span>Ctrl+L</span></button>
          <button class="menu-command" type="button" data-action="search-solar-arc">太陽弧角法(&A)... <span>Ctrl+E</span></button>
          <hr>
          <button class="menu-command" type="button" data-action="search-sun-mountain">動盤太陽到山時間(&A)...</button>
          <hr>
          <button class="menu-command" type="button" data-action="search-eight-time">八字时间(&E)...</button>
          <button class="menu-command" type="button" data-action="search-solar-eclipse">日蝕時間(&M)...</button>
          <button class="menu-command" type="button" data-action="search-lunar-eclipse">月蝕時間(&L)...</button>
          <button class="menu-command" type="button" data-action="search-aspect">相位(&C)...</button>
          <hr>
          <button class="menu-command" type="button" data-action="focus-name">名稱輸入</button>
          <button class="menu-command" type="button" data-view-target="manage">資料管理</button>
        </div>
      </details>
      <details class="menu">
        <summary>檢視(&V)</summary>
        <div class="menu-panel">
          <button class="menu-command" type="button" data-action="update">更新(&U) <span>F1</span></button>
          <hr>
          <button class="menu-command" type="button" data-action="set-current-time">現在時間(&N) <span>F2</span></button>
          <hr>
          <label class="menu-check-row"><input type="checkbox" data-pref="highResolutionUi"> 高解析度使用者介面(&I)</label>
          <hr>
          <button class="menu-command" type="button" data-view-target="chart">星盘</button>
          <button class="menu-command" type="button" data-view-target="calculation">计算</button>
          <button class="menu-command" type="button" data-view-target="eight">八字</button>
          <button class="menu-command" type="button" data-view-target="notes">批注</button>
          <button class="menu-command" type="button" data-view-target="manage">管理</button>
        </div>
      </details>
      <details class="menu">
        <summary>說明(&H)</summary>
        <div class="menu-panel">
          <button class="menu-command" type="button" data-view-target="calculation">操作說明(&O)</button>
          <hr>
          <button class="menu-command" type="button" data-view-target="notes">關於(&A) 七政四餘星盤 - Moira</button>
        </div>
      </details>
    </nav>

    <nav class="main-tabs" aria-label="Moira pages">
      <button class="tab active" type="button" data-view="chart">星盤</button>
      <button class="tab" type="button" data-view="calculation">計算</button>
      <button class="tab" type="button" data-view="eight">八字</button>
      <button class="tab" type="button" data-view="notes">批注</button>
      <button class="tab" type="button" data-view="manage">管理</button>
    </nav>

    <div class="subbar">
      <span id="viewTitle">星盤 - 回歸制</span>
      <span class="subbar-status">
        <span id="serverStatus">Checking</span>
        <span id="apiVersion">等待服務響應</span>
      </span>
    </div>

    <main class="workspace">
      <section id="chartView" class="view chart-view active" data-view-panel="chart">
        <div class="chart-canvas">
          <img id="chartImage" alt="Moira chart preview" hidden>
          <div id="emptyChart" class="empty-chart">請輸入資料並點擊「計算星盤」。</div>
        </div>

        <aside class="control-panel">
          <form id="chartForm" class="app-form">
            <section class="black-card identity-card">
              <label class="name-field">
                名稱輸入
                <input name="name" value="" autocomplete="name">
              </label>
              <fieldset class="gender-field">
                <legend>性別</legend>
                <label><input name="sex" type="radio" value="male" checked> 男</label>
                <label><input name="sex" type="radio" value="female"> 女</label>
              </fieldset>
            </section>

            <section class="black-card">
              <h2>出生年月日時及地點</h2>
              <div class="moira-date-row" data-datetime="birth">
                <select data-part="month" aria-label="出生月份"></select>
                <input data-part="day" value="10" inputmode="numeric" aria-label="出生日">
                <input data-part="year" value="2006" inputmode="numeric" aria-label="出生年">
                <input data-part="hour" value="9" inputmode="numeric" aria-label="出生時">
                <input data-part="minute" value="58" inputmode="numeric" aria-label="出生分">
                <select data-part="ampm" aria-label="出生上午下午">
                  <option value="AM">AM</option>
                  <option value="PM">PM</option>
                </select>
                <span class="spin-button" aria-hidden="true"></span>
              </div>
              <input name="birthDate" type="hidden" value="2006-04-10">
              <input name="birthTime" type="hidden" value="09:58">
              <select name="country" aria-label="國家">
                <option value="中國">中國</option>
                <option value="中国">中国</option>
                <option value="美國">美國</option>
                <option value="美国">美国</option>
              </select>
              <div class="place-grid">
                <select name="city" aria-label="城市">
                  <option value="北京" selected>北京</option>
                  <option value="上海">上海</option>
                  <option value="台北">台北</option>
                  <option value="香港">香港</option>
                  <option value="洛杉磯">洛杉磯</option>
                </select>
                <select name="zone" aria-label="時區">
                  <option value="Asia/Shanghai">Asia/Shanghai</option>
                  <option value="Asia/Taipei">Asia/Taipei</option>
                  <option value="Asia/Hong_Kong">Asia/Hong_Kong</option>
                  <option value="America/Los_Angeles">America/Los_Angeles</option>
                </select>
              </div>
            </section>

            <section class="black-card">
              <h2>流年</h2>
              <div class="moira-date-row" data-datetime="now">
                <select data-part="month" aria-label="流年月份"></select>
                <input data-part="day" value="9" inputmode="numeric" aria-label="流年日">
                <input data-part="year" value="2026" inputmode="numeric" aria-label="流年年">
                <input data-part="hour" value="12" inputmode="numeric" aria-label="流年時">
                <input data-part="minute" value="30" inputmode="numeric" aria-label="流年分">
                <select data-part="ampm" aria-label="流年上午下午">
                  <option value="AM">AM</option>
                  <option value="PM">PM</option>
                </select>
                <span class="spin-button" aria-hidden="true"></span>
              </div>
              <input name="nowDate" type="hidden" value="2026-04-09">
              <input name="nowTime" type="hidden" value="12:30">
            </section>

            <input name="mountainPos" type="hidden" value="0.0">
            <input name="mode" type="hidden" value="traditional">
            <input name="astroMode" type="hidden" value="natal">
            <input name="timeAdjust" type="hidden" value="2">
            <textarea class="hidden-metadata" name="note" rows="1" spellcheck="false"></textarea>

            <button class="primary-action" type="submit">計算星盤</button>
          </form>
        </aside>
      </section>

      <section id="calculationView" class="view text-view" data-view-panel="calculation">
        <pre id="resultBox" class="blue-text">等待連接...</pre>
      </section>

      <section id="eightView" class="view text-view" data-view-panel="eight">
        <pre id="eightText" class="blue-text">尚未計算八字資料。</pre>
      </section>

      <section id="notesView" class="view text-view" data-view-panel="notes">
        <pre id="noteText" class="blue-text">尚未生成批注資料。</pre>
      </section>

      <section id="manageView" class="view manage-view" data-view-panel="manage">
        <div class="manager-table-wrap">
          <table>
            <thead>
              <tr>
                <th></th>
                <th></th>
                <th>名稱</th>
                <th>性別</th>
                <th>出生時間</th>
                <th>出生地點</th>
                <th>批注</th>
              </tr>
            </thead>
            <tbody id="entryTable"></tbody>
          </table>
        </div>
        <label class="manager-import">
          <span>匯入 / 匯出內容</span>
          <textarea id="entryImport" rows="4" spellcheck="false"></textarea>
        </label>
      </section>
    </main>

    <footer class="bottom-toolbar">
      <button id="importMri" type="button">開啟</button>
      <button id="importEntries" type="button">加入</button>
      <button id="exportMri" type="button">存檔</button>
      <button id="exportEntries" type="button">另存新檔</button>
      <button class="nudge-button" type="button" aria-label="上一列">▲</button>
      <button class="nudge-button" type="button" aria-label="下一列">▼</button>
      <button id="saveEntry" type="button">新增</button>
      <button id="deleteEntry" type="button">刪除</button>
      <button id="updateEntry" type="button">更新</button>
      <button id="packEntry" type="button" hidden>Legacy DataEntry</button>
      <input id="mriFile" type="file" accept=".mri" hidden>
      <input id="textImportFile" type="file" accept=".txt,.text,.ini,.conf,.prop,.json" hidden>
      <input class="archive-name" aria-label="資料檔名稱">
      <span class="toolbar-spacer"></span>
      <span id="rowCount">0 列</span>
    </footer>
  </div>

  <div class="hidden-metadata" aria-hidden="true">
    <div id="textTabs">
      <button type="button" data-page="calculation">計算</button>
      <button type="button" data-page="eightCharacters">八字</button>
      <button type="button" data-page="notes">批注</button>
    </div>
    <div id="featureGrid"></div>
    <ul id="guardrails"></ul>
  </div>

  <dialog id="optionDialog" class="app-dialog">
    <form method="dialog">
      <header>
        <h2 id="optionDialogTitle">設定</h2>
        <button value="cancel" aria-label="關閉">×</button>
      </header>
      <div id="optionDialogBody" class="dialog-body"></div>
      <menu>
        <button value="cancel">Cancel</button>
        <button id="optionDialogOk" value="default">OK</button>
      </menu>
    </form>
  </dialog>

  <script src="/app.js?v=app-ui-native-63"></script>
</body>
</html>
